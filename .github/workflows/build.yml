name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack project archive (if present)
        shell: bash
        run: |
          set -e
          archive="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | head -n 1 || true)"
          if [ -n "$archive" ]; then
            mkdir -p extracted
            unzip -o "$archive" -d extracted
          fi

      - name: Find Android project and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) ! -path './.git/*' | head -n 1)"

          if [ -z "$gradle_file" ]; then
            echo "Не найден settings.gradle/settings.gradle.kts. Проверьте, что ZIP проекта загружен в репозиторий."
            exit 1
          fi

          project_dir="$(dirname "$gradle_file")"
          echo "Android project: $project_dir"

          if [ ! -f "$project_dir/gradlew" ]; then
            echo "В проекте нет gradlew (Gradle Wrapper)."
            exit 1
          fi

          chmod +x "$project_dir/gradlew"
          cd "$project_dir"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMMWAY-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
