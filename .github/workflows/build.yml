name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | head -n 1 || true)"

          if [ -n "$archive" ]; then
            mkdir -p extracted
            unzip -o "$archive" -d extracted
          fi

      - name: Find Android project and build APK
        shell: bash
        run: |
          set -euo pipefail

          gradle_file="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) ! -path './.git/*' | head -n 1)"

          if [ -z "$gradle_file" ]; then
            echo "Не найден settings.gradle"
            exit 1
          fi

          project_dir="$(dirname "$gradle_file")"

          echo "Project directory: $project_dir"

          cd "$project_dir"

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMMWAY-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
